services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: cocos
      POSTGRES_USER: cocos
      POSTGRES_PASSWORD: cocos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocos -d cocos"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cocos
      DB_USERNAME: cocos
      DB_PASSWORD: cocos
    depends_on:
      postgres:
        condition: service_healthy
    # Temurin JRE has no curl/wget; bash /dev/tcp avoids extra packages.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q UP <&3'",
        ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 60s

  otel-lgtm:
    image: grafana/otel-lgtm:0.8.4
    profiles: ["observability"]
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

volumes:
  postgres_data:
