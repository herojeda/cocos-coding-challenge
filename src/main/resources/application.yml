spring:
  application:
    name: cocos-challenge
  jackson:
    # ADR-010: JSON fields in snake_case (Jackson 3 PropertyNamingStrategies.SNAKE_CASE)
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cocos}
    username: ${DB_USERNAME:cocos}
    password: ${DB_PASSWORD:cocos}

logging:
  structured:
    format:
      console: ecs
    json:
      # Micrometer MDC keys → ECS field names
      rename:
        traceId: trace.id
        spanId: span.id


management:
  endpoints:
    web:
      exposure:
        include: health
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false

# ADR-009: SQL text may appear in spans; bind parameter values must not.
jdbc:
  datasource-proxy:
    include-parameter-values: false

# ADR-005: bounded JDBC fetch size for ledger reconstruction streams.
cocos:
  persistence:
    ledger-fetch-size: 500
